[package]
name = "hbackup"
version = "0.6.0"
edition = "2024"
authors = ["asthetik"]
homepage = "https://github.com/asthetik/hbackup"
repository = "https://github.com/asthetik/hbackup"
description = """
hbackup is a sample, high-performance, cross-platform backup tool written
in Rust. It is designed to be fast, efficient, and easy to use,
with a focus on performance and reliability.
"""
license = "MIT"
keywords = ["hbackup", "bk", "backup", "cli"]
categories = ["command-line-utilities"]
exclude = [
    ".github/*",
    "scripts/*",
    "deny.toml",
]
rust-version = "1.88.0"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
dirs = "6.0"
toml = "1.1"
flate2 = "1.1"
tar = "0.4"
walkdir = "2.5"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.20", features = ["compress"] }
zstd = "0.13"
bzip2 = "0.6"
xz2 = { version = "0.1", features = ["static"] }
lz4 = "1.28"
tokio = { version = "1.52", features = ["rt-multi-thread", "fs", "macros"] }
futures = "0.3"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.27"
filetime = "0.2"
criterion = { version = "0.8", features = ["html_reports"] }
rand = "0.10"
assert_fs = "1.1"
predicates = "3.1"
tokio = { version = "1.52", features = ["rt", "macros", "test-util"] }
assert_cmd = "2.2"

[[bin]]
name = "bk"
path = "src/main.rs"

[profile.release]
debug = 1
panic = "abort"

[profile.release-lto]
inherits = "release"
opt-level = 3
strip = "symbols"
lto = "fat"
panic = "abort"
debug-assertions = false
incremental = false
codegen-units = 1
